name: Lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # golangci-lint is installed by the action — deliberately NOT a go.mod
  # dependency, so the library keeps a two-dependency module graph.
  #
  # The matrix exists because this package is heavily build-tagged: a single
  # run type-checks only the files selected by one GOARCH/tag combination and
  # leaves the rest of the package unlinted.
  golangci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, tags: "" }
          - { goarch: arm64, tags: "" }
          - { goarch: "386", tags: "" }
          - { goarch: amd64, tags: purego }
    name: golangci-lint (${{ matrix.goarch }}${{ matrix.tags && format(' {0}', matrix.tags) || '' }})
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      # cgo cannot cross-compile without a C toolchain, which makes package
      # loading fail for non-native GOARCH.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --build-tags=${{ matrix.tags }}

  # go vet is a SEPARATE, non-negotiable step: its asmdecl analyzer is the
  # only checker that validates assembly against the Go declarations (TEXT
  # frame/argument sizes, FP offsets, operand widths). golangci-lint's govet
  # does not see .s files, so it cannot substitute for this — verified by
  # introducing a deliberate `$200-8` frame bug, which `go vet` reports and
  # golangci-lint does not.
  #
  # Cross-compiling vet checks each architecture's assembly from one runner,
  # so the amd64 BMI2 kernel is validated even though this job runs wherever.
  vet-asm:
    name: go vet (asmdecl, all arches)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: vet every build variant
        run: |
          set -euxo pipefail
          for arch in amd64 arm64 386 riscv64; do
            GOOS=linux GOARCH="$arch" go vet ./...
          done
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=linux GOARCH=amd64 go vet -tags purego ./...

  checks:
    name: gofmt / tidy / vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # gofmt covers every .go file including the //go:build ignore
      # generators, which golangci-lint cannot load (they are package main in
      # a package keccak directory).
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      # asmfmt is gofmt for Go assembly — the only formatter that exists for
      # it. Both .s files are kept asmfmt-clean, including the generated one:
      # `go generate` pipes the generator's output through asmfmt (see the
      # directives in keccak.go), so this check and the generated-assembly
      # drift check in ci.yml cannot contradict each other.
      #
      # Auditing note: keccakf_arm64.s is copied from Go's
      # crypto/internal/fips140/sha3. Compare it against upstream with
      # `diff -w`, since asmfmt changes only whitespace.
      - name: asmfmt
        run: |
          # `set -e` is the runner's default shell flag, but state it so the
          # guarantee does not depend on that: a tool failure (bad module
          # fetch, parse error) must fail the step rather than be read as
          # "no diff". One version string, one invocation — `-d` is silent
          # when the files are clean and prints the diff when they are not.
          # The suggested fix is asmfmt itself; `go generate` would only
          # reach the generated amd64 file, not hand-written assembly.
          set -euo pipefail
          asmfmt="github.com/klauspost/asmfmt/cmd/asmfmt@v1.3.2"
          diff="$(go run "$asmfmt" -d .)"
          if [ -n "$diff" ]; then
            echo "::error::assembly is not asmfmt-clean; fix with: go run $asmfmt -w ."
            echo "$diff"
            exit 1
          fi

      - name: go.mod tidy
        run: go mod tidy -diff
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
